<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients for Seal -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA6E"/>
      <stop offset="30%" stop-color="#C99E50"/>
      <stop offset="70%" stop-color="#EAD093"/>
      <stop offset="100%" stop-color="#B88E3E"/>
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009BD6"/>
      <stop offset="100%" stop-color="#007DAF"/>
    </linearGradient>

    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE0083"/>
      <stop offset="100%" stop-color="#C7006B"/>
    </linearGradient>

    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE00"/>
      <stop offset="100%" stop-color="#F2B700"/>
    </linearGradient>
    
    <!-- Drop Shadow for Pill Badge -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left Circular Seal (Monogram) -->
  <g transform="translate(145, 210)">
    <!-- Outer Gold Ring -->
    <circle r="132" fill="none" stroke="url(#goldGradient)" stroke-width="7"/>
    <!-- Inner Gap Spacer -->
    <circle r="121" fill="none" stroke="url(#goldGradient)" stroke-width="2.5"/>
    <circle r="116" fill="none" stroke="url(#goldGradient)" stroke-width="5"/>
    
    <!-- MD Monogram Graphics -->
    <g transform="translate(-5, 0)">
      <!-- Black Ribbon Shadow part of M -->
      <path d="M-52,48 L-52,-28 L-30,-48 L-30,48 Z" fill="#111827"/>
      
      <!-- Magenta Ribbon (M Left & Center loop) -->
      <path d="M-68,48 L-68,-36 L-48,-52 L-20,-24 L5,-52 L26,-32 L-20,16 L-48,-12 L-48,48 Z" fill="url(#magentaGrad)"/>
      <path d="M-20,-24 L18,-58 L38,-38 L5,-5 Z" fill="url(#magentaGrad)"/>

      <!-- Cyan Arc (Upper part of D) -->
      <path d="M-28,-44 C-5,-68 35,-65 58,-42 C74,-26 78,-4 70,16 L48,5 C54,-10 50,-24 38,-34 C22,-48 -8,-48 -28,-30 Z" fill="url(#cyanGrad)"/>

      <!-- Yellow Arc (Lower part of D) -->
      <path d="M-22,48 C10,58 48,52 68,26 C76,14 78,-2 72,-16 L52,-5 C55,7 52,18 44,26 C28,42 -4,42 -22,28 Z" fill="url(#yellowGrad)"/>
    </g>
  </g>

  <!-- Right Side Typography & Badge -->
  <!-- 1. "PRINTERS" Cyan Pill Badge -->
  <g transform="translate(325, 105)">
    <rect width="420" height="92" rx="46" ry="46" fill="url(#cyanGrad)" filter="url(#softShadow)"/>
    <text x="210" y="64" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">PRINTERS</text>
  </g>

  <!-- 2. "DESIGN  PRINT  ADVERTISING" Tagline -->
  <g transform="translate(325, 240)">
    <text x="210" y="0" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-weight="800" font-size="25" fill="url(#magentaGrad)" text-anchor="middle" letter-spacing="3.5">DESIGN   PRINT   ADVERTISING</text>
  </g>

  <!-- 3. Decorative Flourish Divider -->
  <g transform="translate(535, 275) scale(0.95)" fill="#111827">
    <path d="M0,-12 C18,-12 34,-22 55,-22 C78,-22 96,-10 120,-3 C138,2 165,4 190,0 C160,8 135,14 110,9 C85,4 65,-8 45,-8 C30,-8 15,-2 0,4 C-15,-2 -30,-8 -45,-8 C-65,-8 -85,4 -110,9 C-135,14 -160,8 -190,0 C-165,4 -138,2 -120,-3 C-96,-10 -78,-22 -55,-22 C-34,-22 -18,-12 0,-12 Z"/>
    <path d="M0,-18 C10,-18 20,-26 35,-26 C50,-26 65,-16 85,-10 C65,-5 50,0 35,-6 C20,-12 10,-8 0,-8 C-10,-8 -20,-12 -35,-6 C-50,0 -65,-5 -85,-10 C-65,-16 -50,-26 -35,-26 C-20,-26 -10,-18 0,-18 Z"/>
    <circle cx="0" cy="-6" r="3"/>
    <circle cx="22" cy="-8" r="2.5"/>
    <circle cx="-22" cy="-8" r="2.5"/>
  </g>

  <!-- 4. Contact Phone Number -->
  <g transform="translate(325, 350)">
    <text x="210" y="0" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="46" fill="#111827" text-anchor="middle" letter-spacing="3">81461 41450</text>
  </g>
</svg>
