<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA6E"/>
      <stop offset="50%" stop-color="#C99E50"/>
      <stop offset="100%" stop-color="#B88E3E"/>
    </linearGradient>
    <linearGradient id="cyanGradHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009BD6"/>
      <stop offset="100%" stop-color="#007DAF"/>
    </linearGradient>
    <linearGradient id="magentaGradHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE0083"/>
      <stop offset="100%" stop-color="#C7006B"/>
